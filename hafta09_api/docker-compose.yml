services:
  api:
    build: .
    environment:
      - MODEL_YOLU=model/model_churn.pkl
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/saglik')"]
      interval: 10s
      retries: 3
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
